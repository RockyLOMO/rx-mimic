# Copy to D:/rx-mimic/config/application-prod.yml; supply secrets externally.
# No JMX agent/exporter. FRP forwards HTTP to loopback only.
server:
  address: 127.0.0.1
  port: 81
app:
  fiddler-enabled: false
  nameserverEnabled: false
  storage:
    h2DbPath: D:/rx-mimic/data/browser-task-db
    priceDbPath: D:/rx-mimic/data/product-price-db
  custom:
    remotingEnabled: false
    queueMaxConcurrency: 1
    # 远程排查时打开。每步保存 HTML、标签视口 PNG 和桌面 PNG。
    debugEnabled: true
    chrome:
      profileBasePath: D:/rx-mimic/profiles
      defaultProfileName: common
      maxActive: 1
      minIdle: 1
      # 后台标签只预开下一个排队任务的起始页。不是并行，maxActive 仍是 1。
      tabSlots: 2
    priceWatch:
      tbIdentityMaxCandidates: 3
      tbIdentityTimeoutSeconds: 90
    loginKeepAlive:
      enabled: false
    orderSync:
      enabled: true
      scanIntervalSeconds: 30
      defaultIntervalMinutes: 10
      initialBackfillDays: 7
      regularOverlapDays: 3
      lowFrequencyBackfillDays: 30
      bootstrapNotify: true
      sources:
        - id: jd-main
          platform: jd
          profileName: common
          accountName: jd-prod-account
          allowedCallers: ["*"]
          intervalMinutes: 10
          enabled: true
        - id: tb-main
          platform: tb
          profileName: common
          accountName: tb-prod-account
          allowedCallers: ["*"]
          intervalMinutes: 10
          enabled: true
      webhook:
        enabled: true
        workerThreads: 2
        httpTimeoutSeconds: 5
        retentionDays: 30
        subscribers: []
