name: rx-mimic compile and offline tests
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify SSH deployment configuration and host pinning
        run: |
          python3 -m pip install --disable-pip-version-check 'paramiko==5.0.0'
          python3 -m unittest discover -s deploy/app-crawler -p 'test_*.py' -v
      - name: Checkout pinned rxlib dependency source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: RockyLOMO/rxlib
          ref: f831f76cde8257d8a33188ab37f315c72c456b43
          path: dependency-source/rxlib
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '8'
          distribution: temurin
          cache: maven
      - name: Build pinned Java 8 dependency locally
        run: mvn -B --no-transfer-progress -f dependency-source/rxlib/pom.xml -pl rxlib-x -am -DskipTests=true -Dmaven.test.skip=true -Dmaven.javadoc.skip=true install
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: temurin
      - name: Compile and run offline contract tests
        run: mvn -B --no-transfer-progress -pl crawler-bootstrap -am -DskipTests=false -Dmaven.test.skip=false -Dsurefire.failIfNoSpecifiedTests=false -Dtest=TbVerificationFlowTest,LoginKeepAliveServiceTest,WebBrowserLinkDestinationTest,TbUnionAnalysisPageTest,TbNumericLookupTest,ProductIdentityStoreTest,ProductIdentityResolverTest,UnionMaterialBoundaryTest,ProductVisitBudgetTest,PriceApplicationContextTest,JdResultChecksTest,TbResultChecksTest,FileKeepAliveUrlStoreTest,CustomCrawlQueueServiceTest,BrowserOwnerExecutorTest,ChromeProfilePathsTest,RelativePathDefaultsTest,RuntimeHealthControllerTest,WebBrowserSessionTest,BrowserProfileManagerTest,AsyncTaskControllerTest,TaskApiAuthenticationFilterTest,AsyncTaskClientTest,CookieJarConfigTest,CustomCrawlRemotingServiceTest,ServiceInstanceLockTest,TaskEntryUrlsTest,SliderVerifyHandlerTest,TabPrefetchTest,MallSearchPagesTest,PromotionSlotsTest,TbUnionPageApiTest,JdUnionPageApiTest,PriceWatchLogicTest,PriceBroadcastTest,CrawlFallbackServiceTest,SensitiveUrlsTest,DebugSnapshotPolicyTest,LoginNotificationServiceTest package
