name: Build and deploy rx-mimic

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Optional commit SHA; leave blank to deploy the latest default-branch commit'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rx-mimic-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: rx-mimic-production
    timeout-minutes: 45
    steps:
      - name: Checkout deployment implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release commit
        id: release
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          RELEASE_SHA="$REQUESTED_COMMIT"
          if [[ -z "$RELEASE_SHA" ]]; then
            RELEASE_SHA=$(git rev-parse "origin/$DEFAULT_BRANCH^{commit}")
          fi
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$RELEASE_SHA" "origin/$DEFAULT_BRANCH"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying commit: $RELEASE_SHA"
          git checkout --detach "$RELEASE_SHA"
      - name: Prepare SSH client
        run: python3 -m pip install --disable-pip-version-check 'paramiko==5.0.0'
      - name: Validate AnZhi deployment connection
        env:
          ANZHI_SSH: ${{ secrets.ANZHI_SSH }}
        run: python3 deploy/app-crawler/deploy_ssh.py --check
      - name: Checkout pinned rxlib dependency source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: RockyLOMO/rxlib
          ref: f831f76cde8257d8a33188ab37f315c72c456b43
          path: dependency-source/rxlib
          persist-credentials: false
      - name: Set up dependency JDK 8
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '8'
          distribution: temurin
          cache: maven
      - name: Build pinned Java 8 dependency locally
        run: mvn -B --no-transfer-progress -f dependency-source/rxlib/pom.xml -pl rxlib-x -am -DskipTests=true -Dmaven.test.skip=true -Dmaven.javadoc.skip=true install
      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: temurin
      - name: Build and test without live browser tasks
        run: mvn -B --no-transfer-progress -pl crawler-bootstrap -am -DskipTests=false -Dmaven.test.skip=false -Dsurefire.failIfNoSpecifiedTests=false -Dtest=CustomCrawlQueueServiceTest,BrowserOwnerExecutorTest,ChromeProfilePathsTest,RelativePathDefaultsTest,RuntimeHealthControllerTest,WebBrowserSessionTest,BrowserProfileManagerTest,AsyncTaskControllerTest,TaskApiAuthenticationFilterTest,AsyncTaskClientTest,CookieJarConfigTest,CustomCrawlRemotingServiceTest,ServiceInstanceLockTest,TaskEntryUrlsTest,SliderVerifyHandlerTest,TabPrefetchTest,MallSearchPagesTest,PromotionSlotsTest,TbUnionPageApiTest,JdUnionPageApiTest,PriceWatchLogicTest,CrawlFallbackServiceTest,TbLastResultStoreTest package
      - name: Prepare exact executable artifact
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          test -f crawler-bootstrap/target/crawler-bootstrap-1.0.jar
          unzip -p crawler-bootstrap/target/crawler-bootstrap-1.0.jar META-INF/MANIFEST.MF | grep -q 'Main-Class: org.springframework.boot.loader'
          mkdir -p package
          cp crawler-bootstrap/target/crawler-bootstrap-1.0.jar package/app.jar
          cp deploy/app-crawler/service.ps1 package/service.ps1
          export JAR_SHA=$(sha256sum package/app.jar | cut -d ' ' -f 1)
          python3 - <<'PY'
          import datetime, json, os
          with open('package/manifest.json', 'w') as f:
              json.dump({'version': os.environ['RELEASE_SHA'], 'sha256': os.environ['JAR_SHA'],
                         'sourceKind': 'git-commit', 'baseCommit': os.environ['RELEASE_SHA'],
                         'builtAt': datetime.datetime.now(datetime.timezone.utc).isoformat()}, f)
          PY
      - name: Upload and deploy to AnZhi
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          ANZHI_SSH: ${{ secrets.ANZHI_SSH }}
        run: python3 deploy/app-crawler/deploy_ssh.py --package-dir package --release-sha "$RELEASE_SHA"
