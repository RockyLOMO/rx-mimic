name: Build and deploy rx-mimic

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full 40-character commit SHA reachable from the default branch'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rx-mimic-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: rx-mimic-production
    timeout-minutes: 45
    steps:
      - name: Checkout deployment implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate requested commit
        env:
          RELEASE_SHA: ${{ inputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$RELEASE_SHA" "origin/$DEFAULT_BRANCH"
          git checkout --detach "$RELEASE_SHA"
      - name: Checkout pinned rxlib dependency source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: RockyLOMO/rxlib
          ref: f831f76cde8257d8a33188ab37f315c72c456b43
          path: dependency-source/rxlib
          persist-credentials: false
      - name: Set up dependency JDK 8
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '8'
          distribution: temurin
          cache: maven
      - name: Build pinned Java 8 dependency locally
        run: mvn -B --no-transfer-progress -f dependency-source/rxlib/pom.xml -pl rxlib-x -am -DskipTests=true -Dmaven.test.skip=true -Dmaven.javadoc.skip=true install
      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: temurin
      - name: Build and test without live browser tasks
        run: mvn -B --no-transfer-progress -pl crawler-bootstrap -am -DskipTests=false -Dmaven.test.skip=false -Dsurefire.failIfNoSpecifiedTests=false -Dtest=CustomCrawlQueueServiceTest,BrowserOwnerExecutorTest,ChromeProfilePathsTest,RelativePathDefaultsTest,RuntimeHealthControllerTest,WebBrowserSessionTest,BrowserProfileManagerTest,AsyncTaskControllerTest,TaskApiAuthenticationFilterTest,AsyncTaskClientTest,CookieJarConfigTest,CustomCrawlRemotingServiceTest,ServiceInstanceLockTest,TaskEntryUrlsTest,SliderVerifyHandlerTest,TabPrefetchTest,MallSearchPagesTest package
      - name: Prepare exact executable artifact
        env:
          RELEASE_SHA: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          test -f crawler-bootstrap/target/crawler-bootstrap-1.0.jar
          unzip -p crawler-bootstrap/target/crawler-bootstrap-1.0.jar META-INF/MANIFEST.MF | grep -q 'Main-Class: org.springframework.boot.loader'
          mkdir -p package
          cp crawler-bootstrap/target/crawler-bootstrap-1.0.jar package/app.jar
          cp deploy/app-crawler/service.ps1 package/service.ps1
          export JAR_SHA=$(sha256sum package/app.jar | cut -d ' ' -f 1)
          python3 - <<'PY'
          import datetime, json, os
          with open('package/manifest.json', 'w') as f:
              json.dump({'version': os.environ['RELEASE_SHA'], 'sha256': os.environ['JAR_SHA'],
                         'sourceKind': 'git-commit', 'baseCommit': os.environ['RELEASE_SHA'],
                         'builtAt': datetime.datetime.now(datetime.timezone.utc).isoformat()}, f)
          PY
      - name: Upload and deploy with pinned SSH identity
        env:
          RELEASE_SHA: ${{ inputs.commit }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_.-]+$ ]]
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/rx-mimic-key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/rx-mimic-known-hosts"
          chmod 600 "$HOME/.ssh/rx-mimic-key" "$HOME/.ssh/rx-mimic-known-hosts"
          opts=(-i "$HOME/.ssh/rx-mimic-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/rx-mimic-known-hosts" -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=3)
          stage="upload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export REMOTE_STAGE="$stage"
          # The approved one-time Initialize action must have created this root already.
          scp "${opts[@]}" -P "$DEPLOY_PORT" -r package "$DEPLOY_USER@$DEPLOY_HOST:D:/rx-mimic/$stage"
          encoded=$(python3 - <<'PY'
          import base64, os
          sha = os.environ['RELEASE_SHA']
          stage = os.environ['REMOTE_STAGE']
          script = r"""$ErrorActionPreference='Stop'
          $root='D:\rx-mimic'
          $source=Join-Path $root 'STAGE'
          $target=Join-Path $root 'releases\__VERSION__'
          if(Test-Path -LiteralPath $target){throw 'Immutable release already exists; inspect it instead of overwriting'}
          $manifest=Get-Content -LiteralPath (Join-Path $source 'manifest.json') -Raw | ConvertFrom-Json
          if($manifest.version -ne '__VERSION__' -or (Get-FileHash -LiteralPath (Join-Path $source 'app.jar') -Algorithm SHA256).Hash -ne $manifest.sha256){throw 'Upload hash/version mismatch'}
          Move-Item -LiteralPath $source -Destination $target
          & (Join-Path $target 'service.ps1') -Action Deploy -Root $root -Version '__VERSION__'
          if (-not $?) { exit 1 }
          """
          script = script.replace('STAGE', stage).replace('__VERSION__', sha)
          print(base64.b64encode(script.encode('utf-16le')).decode())
          PY
          )
          ssh "${opts[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "powershell.exe -NoLogo -NoProfile -NonInteractive -EncodedCommand $encoded"
      - name: Remove runner deployment key
        if: always()
        run: rm -f "$HOME/.ssh/rx-mimic-key" "$HOME/.ssh/rx-mimic-known-hosts"
