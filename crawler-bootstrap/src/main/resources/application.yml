server:
  port: 81
  tomcat:
    threads:
      min-spare: 1
  ssl:
    enabled: false
  max-http-header-size: 16KB
spring:
  application:
    name: svc-mercury
apollo:
  bootstrap:
    enabled: true
    namespaces: application,middleware
app:
  id: svc-mercury
  smtp:
    host: smtp.gmail.com
    port: 587
    ssl: false
    startTls: true
    timeoutMillis: 20000
    # 账号和密钥不写在这里，发送时从 keysFile 读取
    username:
    password:
    from:
    to: ilovehaley.kid@gmail.com
  net:
    connectTimeoutMillis: 40000
    ntp:
      enableFlags: 3
  storage:
    h2DbPath: ./browser-task-db
  browser:
    # 预热/池化浏览器统一注入 stealth 预检脚本：池复用时任务级 fingerprintEnabled 不生效，
    # 必须全局开，否则 navigator.webdriver 裸奔、sannysoft WebDriver(New) 必挂
    fingerprintEnabled: true
    fingerprintScriptPath: /bot/chrome-fingerprint.js
    fingerprintStealthScriptPath: /static/js/stealth.min.js
    fingerprintCheckUrl: https://bot.sannysoft.com/
    fingerprintHeadless: false
    fingerprintDiagnostics: false
    playwrightChannel: chrome
    playwrightExecutablePath:
    # 空=跟随运行机器语言/时区；换机自动适应，不要写死开发机环境
    locale:
    timezoneId:
    blockResourceEnabled: false
    humanInputEnabled: true
    humanActionMinDelayMillis: 180
    humanActionMaxDelayMillis: 650
    operationRandomMinDelayMillis: 80
    operationRandomMaxDelayMillis: 320
    mouseMoveMinSteps: 24
    mouseMoveMaxSteps: 56
    typingMinDelayMillis: 90
    typingMaxDelayMillis: 260
  custom:
    remotingEnabled: true
    remotingListenPort: 1221
    queueMaxConcurrency: 1
    queueTimeoutSeconds: 600
    debugEnabled: false
    maxTaskMinutes: 4
    loginNotification:
      enabled: true
      minIntervalSeconds: 300
      mail:
        enabled: true
        subjectPrefix: "[rx-mimic]"
        keysFile: D:\home\.envKeys\keys.json
        to: ilovehaley.kid@gmail.com
    loginKeepAlive:
      enabled: false
      jdEnabled: true
      tbEnabled: true
      initialDelayMillis: 60000
      fixedDelayMillis: 1800000
      pageTimeoutSeconds: 60
      harvestEnabled: true
      harvestPerRunCount: 5
      maxUrlsPerPlatform: 50
      urlStorePath: ./data/keepalive/urls.json
      startTime:
      endTime:
    chrome:
      # 空 = %LOCALAPPDATA%\rx-mimic\chrome\<profileName>。登录、测试、服务共用。
      # 要换目录再显式写绝对路径，不要写回项目里的 ./data/chrome。
      profileBasePath:
      defaultProfileName: common
      closeBrowserAfterTask: false
      # 必须为 1：一个 profileName 就是一个 Chrome 用户目录，不能再拆 pool 副本。
      maxActive: 1
      minIdle: 1
      preWarm: true
    jdUnion:
      profileName: common
      fingerprintEnabled: true
      headless: false
      preflightEnabled: true
      preflightUrl: https://bot.sannysoft.com/
      preflightStrict: true
      preflightCacheMinutes: 30
      # false：同进程 30 分钟内复用 Sannysoft；需要每次强制时再开 true
      forcePreflight: false
      overviewUrl: https://union.jd.com/overview
      entireUrl: https://union.jd.com/entire
      orderUrl: https://union.jd.com/order
      loginCheckUrl: https://union.jd.com/overview
      workbenchUrl: https://union.jd.com/proManager/index?pageNo=1
      loginUrlPrefix: https://union.jd.com/index?returnUrl=
      defaultMediaType: 导购媒体推广
      defaultMediaName: 微信
      defaultAdSiteName: 5
      pageTimeoutSeconds: 60
      initialPageTimeoutSeconds: 60
      # 步骤死等（拟人仍靠 humanInput 轨迹）
      stepDelayMillis: 550
      stepDelayRandomMillis: 300
      keepBrowserOpenOnLoginRequired: true
      keepBrowserOpenSecondsOnLoginRequired: 180
      loginWaitSeconds: 180
      defaultOutputPath: ./data/jd-union/output.jsonl
      debugOutputDir: ./data/jd-union/debug
    jdMall:
      profileName: common
      fingerprintEnabled: true
      headless: false
      preflightEnabled: true
      preflightUrl: https://bot.sannysoft.com/
      preflightStrict: true
      preflightCacheMinutes: 30
      forcePreflight: false
      homeUrl: https://www.jd.com
      searchUrlTemplate: https://search.jd.com/Search?keyword={keyword}&enc=utf-8
      itemUrlTemplate: https://item.jd.com/{skuId}.html
      loginUrlPrefix: https://passport.jd.com
      pageTimeoutSeconds: 60
      initialPageTimeoutSeconds: 60
      # 步骤间等待（拟人仍靠 WebBrowser humanInput）
      stepDelayMillis: 700
      stepDelayRandomMillis: 400
      # 页面导航前随机间歇：模拟人浏览节奏（如搜索完成→点开商品详情页之间的停顿），反爬
      navigationPauseMillis: 1500
      navigationPauseRandomMillis: 2500
      keepBrowserOpenOnLoginRequired: true
      keepBrowserOpenSecondsOnLoginRequired: 180
      loginWaitSeconds: 180
      # JDJRV 验证码：先自动拟人拖拽，仍失败转人工等待
      captchaMaxAutoAttempts: 3
      captchaHumanWaitSeconds: 120
      # 搜索：期望条数超过单页时，按第一页实际条数自动翻页
      defaultMaxResults: 60
      maxResultsLimit: 100
      maxSearchPages: 8
      maxScrollRounds: 12
      # 详情：长图上限与拟人滚动步数（2026 版页面更长，滚到底自动提前结束）
      maxDetailImages: 120
      detailScrollSteps: 28
      # 详情图下载（走浏览器上下文，带 cookie/UA）
      imageSaveDir: ./data/jd-mall/images
      downloadDelayMillis: 150
      defaultOutputPath: ./data/jd-mall/output.jsonl
      debugOutputDir: ./data/jd-mall/debug
    tbMall:
      # 搜索：期望条数超过单页时，按第一页实际条数自动翻页
      defaultMaxResults: 60
      maxResultsLimit: 100
      maxSearchPages: 8
    tbPromotion:
      profileName: common
      fingerprintEnabled: true
      headless: false
      preflightEnabled: true
      preflightUrl: https://bot.sannysoft.com/
      preflightStrict: true
      preflightCacheMinutes: 30
      # false：同进程 30 分钟内复用 Sannysoft 结果；真要强制探测再设 true / 请求 forcePreflight
      forcePreflight: false
      homeUrl: https://pub.alimama.com/portal/v2/home/plus/index.htm
      promotionGoodsUrl: https://pub.alimama.com/portal/v2/pages/promo/goods/index.htm
      orderUrl: https://pub.alimama.com/portal/v2/effect/order/overviewOrder/page/index.htm
      loginUrlPrefix: https://login.taobao.com/havanaone/login/login.htm
      defaultMediaName:
      defaultAdSiteName: 5
      pageTimeoutSeconds: 60
      initialPageTimeoutSeconds: 180
      # 步骤间等待（拟人仍靠 WebBrowser humanInput；这里只减「死等」）
      stepDelayMillis: 700
      stepDelayRandomMillis: 400
      keepBrowserOpenOnLoginRequired: true
      keepBrowserOpenSecondsOnLoginRequired: 180
      loginWaitSeconds: 180
      defaultOutputPath: ./data/tb/output.jsonl
      debugOutputDir: ./data/tb/debug
